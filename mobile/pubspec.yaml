name: mobile
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.1.0
  cupertino_icons: ^1.0.8
  google_sign_in: ^7.2.0
  http: ^1.6.0
  flutter_dotenv: ^5.1.0
  shared_preferences: ^2.5.5
  firebase_core: ^4.6.0
  firebase_auth: ^6.3.0
  google_maps_flutter: ^2.17.0
  geocoding: ^3.0.0
  geolocator: ^13.0.0
  cloud_firestore: ^6.2.0
  speech_to_text: ^7.3.0
  url_launcher: ^6.3.0
  flutter_contacts: ^1.1.8
  permission_handler: ^11.3.0
  flutter_local_notifications: ^18.0.1
  shake: ^3.0.0
  sensors_plus: ^6.1.2
  audioplayers: ^6.6.0
  local_auth: ^3.0.1
  timezone: ^0.9.4
  intl: ^0.20.2
  record: ^6.2.0
  image_picker: ^1.2.1
  firebase_storage: ^13.3.0
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/

flutter_icons:
  android: true
  ios: true
  image_path: "assets/safetext_icon.png"

